 background:linear-gradient(90deg,#ff9ec7,#ffd36b 27%,#9ff0bf 50%,#94d8ff 73%,#cdb2ff);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 2px 2px rgba(8,4,22,.7)) drop-shadow(0 0 10px rgba(255,236,250,.35))}

<!-- 잿빛 = grey_world.gdshader: (밝기 × 0.7 + (0.45, 0.47, 0.52) × 0.3) × 0.82, 밝기 = 0.299R + 0.587G + 0.114B -->
<svg width="0" height="0" style="position:absolute"><filter id="ash" color-interpolation-filters="sRGB"><feColorMatrix type="matrix"
 values=".171626 .336938 .065436 0 .1107  .171626 .336938 .065436 0 .11562  .171626 .336938 .065436 0 .12792  0 0 0 1 0"/></filter></svg>
<div id="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
<div id="bar"><button id="pp">일시정지</button><input id="sc" type="range" min="0" max="33.5" step="0.01" value="0"><span id="tm">0.0s</span>
 <span>폭 <a href="?w=1280">1280</a> · <a href="?w=1600">1600</a></span></div>
<script>
"use strict";
/* 프롤로그 2차 시안 (묶음 9 D9-4 C 「붓이 화면을 칠하며」). 그림은 모두 실제 게임에서 찍은 층:
   pro_back = 하늘 층(화면 고정) · pro_whale = 넓은 화면의 고래(투명) · pro_front = 앞 구름(투명) · pro_battle/pro_talk = 전투 화면 · 유나 첫 대사(대사창 D9-3 A).
   잿빛 = 게임 grey_world.gdshader와 같은 식. 붓 자국은 절차 생성(심 · 붓털 · 마른 결 · 튄 물감, 양 끝은 늘 뾰족하게 가늘어진다).
   ?w=1600 · ?t=초(그 순간에 멈춤) · ?rec=1(녹화: window.__render(t)) */
const Q=new URLSearchParams(location.search);
const W=Q.get('w')==='1600'?1600:1280,H=720,REC=Q.has('rec');
if(REC)document.body.classList.add('rec');
const DUR=33.5;
const stage=document.getElementById('stage');stage.style.width=W+'px';document.getElementById('bar').style.width=W+'px';
const cv=document.getElementById('cv');cv.width=W;cv.height=H;const X=cv.getContext('2d');
const ZW=W===1600?0.8465:0.7932, RW=ZW/0.7932;   // 넓은 화면 배율 (main.wide_zoom)
const CAMW=[-155,361],CAMB=[W/2,360],PC=[-155,500];
const wp=(x,y)=>[(x-640)*RW+W/2,(y-360)*RW+360];   // 1280 넓은 화면 좌표 → 이 폭의 고래 그림 좌표
const sx=x=>x*W/1280;

/* ---------- 수학 ---------- */
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ss=(a,b,v)=>{const t=cl((v-a)/(b-a));return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-t,3);
const sine=t=>-(Math.cos(Math.PI*cl(t))-1)/2;
function key(t,ks){if(t<=ks[0][0])return ks[0][1];for(let i=1;i<ks.length;i++){if(t<=ks[i][0]){const a=ks[i-1],b=ks[i];return lerp(a[1],b[1],sine((t-a[0])/(b[0]-a[0])))}}return ks[ks.length-1][1]}
function rnd(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

/* ---------- 그림 ---------- */
const IMG={};
function load(k,src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{IMG[k]=i;ok()};i.onerror=()=>no(src);i.src=src})}
// 잿빛 그림: 위 SVG 색 행렬 필터 (file://에서도 되도록 픽셀을 읽지 않는다)
function greyOf(img){const c=mk(img.width,img.height),x=c.getContext('2d');x.filter='url(#ash)';x.drawImage(img,0,0);x.filter='none';return c}
let G={},grain,rays,cC,cG,mG,mC,tmp,tmp2;

/* ---------- 붓 ---------- */
function sample(pts,step){const p=[];
 for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
  const n=Math.max(2,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/step));
  for(let j=0;j<n;j++){const t=j/n,t2=t*t,t3=t2*t,f=k=>.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3);p.push([f(0),f(1)])}}
 p.push(pts[pts.length-1].slice());
 const L=[0];for(let i=1;i<p.length;i++)L.push(L[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));
 const len=L[L.length-1],u=L.map(v=>v/len),n=p.map((_,i)=>{const a=p[Math.max(0,i-1)],b=p[Math.min(p.length-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],m=Math.hypot(dx,dy)||1;return[-dy/m,dx/m]});
 return{p,L,u,n,len}}
/* 붓 한 번 = 길이(px) 위의 폭 그림:
   시작은 둥글게 눌러 앉고(capIn), 끝 tout 구간에서 심이 좁아지다 둥글게 끝난 뒤(coreEnd) 붓털만 갈라져 길이가 제각각 마른 꼬리로 흩어진다.
   움직이는 동안의 머리도 둥근 붓 머리 + 앞으로 살짝 나온 붓털. 어디에도 곧게 잘린 끝이 없다 */
const cap=x=>{x=cl(x);return Math.sqrt(1-(1-x)*(1-x))};
function prep(s){
 s.P=sample(s.pts,3);const len=s.P.len,r=rnd(s.seed*977+13),n=Math.ceil(len/6)+2;
 s.capIn=Math.min(s.w*.42,len*.2);s.tail=(s.tout??.3)*len;s.coreEnd=len-s.tail*.6;s.capOut=Math.min(s.w*.32,s.tail*.5);
 s.nw=new Float32Array(n);s.nl=new Float32Array(n);s.nr=new Float32Array(n);
 const ph=[r()*6.3,r()*6.3,r()*6.3,r()*6.3,r()*6.3];
 for(let i=0;i<n;i++){const d=i*6;s.nw[i]=.07*Math.sin(d/110+ph[0])+.04*Math.sin(d/47+ph[1]);
  s.nl[i]=.03*Math.sin(d/37+ph[2])+.018*Math.sin(d/13+ph[3]);s.nr[i]=.03*Math.sin(d/41+ph[4])+.018*Math.sin(d/15+ph[1])}
 const dry=s.dry??.5,lw=v=>Math.max(.8,s.w*v);
 // 꼬리 붓털: 심이 끝나기 조금 앞에서 시작해 길이가 제각각 (끝으로 갈수록 옅고 가늘게)
 s.tb=[];for(let i=0;i<(s.nt??Math.round(26+s.w/12));i++){const o=(r()*2-1)*.95;s.tb.push({o,d0:s.coreEnd-s.tail*(.25+.5*r()),d1:s.coreEnd+(len-s.coreEnd)*(.3+.7*Math.sqrt(r())),lw:lw(.012+.028*r()),a:.55+.45*r()})}
 // 가장자리 잔털: 폭 바깥으로 살짝 삐져나온 짧은 털
 s.eb=[];for(let i=0;i<(s.ne??Math.round(10+len/60));i++){const d0=r()*len*.9;s.eb.push({o:(r()<.5?-1:1)*(.9+.14*r()),d0,d1:d0+len*(.03+.12*r()),lw:lw(.004+.01*r()),a:.35+.5*r()})}
 // 마른 결: 심 안쪽을 지우는 가는 줄 (뒤쪽일수록 많다) + 처음부터 끝까지 옅은 결 몇 줄
 s.gb=[];for(let i=0;i<(s.ng??Math.round(16+s.w/14));i++){const long=r()<.08,d0=long?r()*len*.3:len*(.5+.42*r());s.gb.push({o:(r()*2-1)*.9,d0,d1:long?d0+len*(.3+.3*r()):d0+len*(.04+.16*r()),lw:lw(.004+.013*r()),a:(long?.08+.12*r():.3+.6*r())*dry})}
 s.sp=[];for(let i=0;i<(s.nsp||0);i++)s.sp.push({u:.08+r()*.9,side:r()<.5?-1:1,d:1.04+r()*1.2,rad:.8+r()*r()*6.5,ex:.55+r()*.9,rot:r()*3});
 s.sk=[];for(let i=0;i<(s.nsk||0);i++)s.sk.push({u:.05+r()*.93,o:(r()*2-1)*.8,sz:2.5+r()*4.5,life:.55+r()*.5,dy:-8-r()*22});
 // 가장자리 마른 결: 심 테두리 안쪽은 물감이 덜 묻은 가는 틈(cut), 바깥은 삐져나온 털 — 테두리가 매끈하게 오린 모양으로 보이지 않게
 s.rg=[];for(let i=0;i<(s.nrg??Math.round(len/8));i++){const cut=r()<.55,side=r()<.5?-1:1,d0=r()*len*.94;
  s.rg.push({cut,o:side*(cut?.78+.2*r():.99+.13*r()),d0,d1:d0+len*(.02+.14*r()),lw:lw(cut?.006+.018*r():.004+.011*r()),a:cut?.55+.45*r():.4+.5*r()})}
 return s}
function noiseAt(arr,L){return arr[Math.min(arr.length-1,(L/6)|0)]}
const headOf=(s,p)=>p>=1?1e9:p*s.P.len;
// 심 폭 (0..1): 둥근 시작 · 끝쪽에서 좁아짐 · 둥근 끝 · 움직이는 동안 둥근 머리
function coreW(s,d,hd){if(d>s.coreEnd)return 0;const len=s.P.len;
 return cap(d/s.capIn)*(1-.32*ss(len-s.tail,s.coreEnd,d))*cap((s.coreEnd-d)/s.capOut)*cap((hd-d)/(s.w*.38))}
// 붓털이 퍼지는 폭: 끝까지 0이 되지 않는다 (털이 한 점으로 모이지 않게), 머리보다 5px 앞까지
function brW(s,d,hd){const len=s.P.len;return(.06+.94*cap((d+2)/s.capIn))*(1-.26*ss(len-s.tail,len,d))*cap((hd+5-d)/(s.w*.3))}
// 심: 가장자리가 부드럽게 물결치는 다각형. 가장자리 선(L/R)을 돌려준다
function core(c,s,p,fill){const P=s.P,hd=headOf(s,p),Lp=[],Rp=[];
 for(let i=0;i<P.p.length;i++){const d=P.L[i];if(d>hd||d>s.coreEnd)break;const hw=s.w*.5*coreW(s,d,hd)*(1+noiseAt(s.nw,d));
  const el=hw*(1+noiseAt(s.nl,d)),er=hw*(1+noiseAt(s.nr,d));
  Lp.push([P.p[i][0]+P.n[i][0]*el,P.p[i][1]+P.n[i][1]*el]);Rp.push([P.p[i][0]-P.n[i][0]*er,P.p[i][1]-P.n[i][1]*er])}
 if(Lp.length<2)return null;c.beginPath();c.moveTo(Lp[0][0],Lp[0][1]);for(let i=1;i<Lp.length;i++)c.lineTo(Lp[i][0],Lp[i][1]);
 for(let i=Rp.length-1;i>=0;i--)c.lineTo(Rp[i][0],Rp[i][1]);c.closePath();if(fill){c.fillStyle=fill;c.fill()}return{L:Lp,R:Rp}}
// 털 한 가닥: d0 → d1을 따라가며 끝 40%에서 옅고 가늘어진다. inside = 심 폭 안(마른 결), 아니면 털 폭(brW)
// 옅어지는 자리는 털 전체 길이(b.d1) 기준 — 그리는 중에도 털마다 자리가 달라 여러 털이 한 줄에서 끊긴 금이 생기지 않고, 그레이디언트라 계단도 없다
const rgbOf=s=>s[0]==='#'?[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)):s.match(/[\d.]+/g).map(Number);
function hair(c,s,b,p,inside,alpha=1){const P=s.P,hd=headOf(s,p),d1=Math.min(b.d1,hd+5);if(d1<=b.d0)return;
 const pts=[],ds=[];for(let i=0;i<P.p.length;i++){const d=P.L[i];if(d<b.d0)continue;if(d>d1)break;
  const k=inside?coreW(s,d,hd)*.96:brW(s,d,hd),hw=s.w*.5*k*(1+noiseAt(s.nw,d));pts.push([P.p[i][0]+P.n[i][0]*hw*b.o,P.p[i][1]+P.n[i][1]*hw*b.o]);ds.push(d)}
 // 붓이 아직 움직이는 중이면(머리에서 잘린 털) 머리 쪽도 젖은 물감처럼 옅어진다 — 털 끝이 둥근 막대처럼 보이지 않게
 const n=pts.length;if(n<2)return;const f0=b.d0+(b.d1-b.d0)*.6,tr=d1<b.d1,fh=tr?Math.max(b.d0,d1-s.w*.8):1e9;
 const aAt=d=>(1-.9*cl((d-f0)/(b.d1-f0)))*(tr?1-.85*cl((d-fh)/Math.max(1,d1-fh)):1);let j=0;while(j<n-1&&ds[j]<Math.min(f0,fh))j++;
 const run=(a,z)=>{c.beginPath();c.moveTo(pts[a][0],pts[a][1]);for(let i=a+1;i<=z;i++)c.lineTo(pts[i][0],pts[i][1]);c.stroke()};
 c.globalAlpha=b.a*alpha;c.lineWidth=b.lw;if(j>0)run(0,j);
 if(j<n-1){const st=c.strokeStyle,[R,G,B,A=1]=rgbOf(st),g=c.createLinearGradient(pts[j][0],pts[j][1],pts[n-1][0],pts[n-1][1]);
  for(let k=0;k<=4;k++)g.addColorStop(k/4,`rgba(${R},${G},${B},${A*aAt(ds[j]+(ds[n-1]-ds[j])*k/4)})`);c.strokeStyle=g;c.lineWidth=b.lw*.8;run(j,n-1);c.strokeStyle=st}
 c.globalAlpha=1}
const pAt=(s,t)=>s.prog?s.prog(t):eo(cl((t-s.t0)/s.dur))*(t>=s.t0?1:0);
function spatter(c,s,p){for(const d of s.sp){if(d.u>p)continue;const P=s.P,i=Math.min(P.p.length-1,Math.round(d.u*(P.p.length-1))),hw=s.w*.5*brW(s,P.L[i],1e9);
 const x=P.p[i][0]+P.n[i][0]*hw*d.d*d.side,y=P.p[i][1]+P.n[i][1]*hw*d.d*d.side;c.beginPath();c.ellipse(x,y,d.rad*d.ex,d.rad,d.rot,0,6.283);c.fill()}}
// 가리개 붓 (잿빛 · 색): tmp에 심 → 마른 결 지우기 → 꼬리 · 가장자리 털 · 튄 물감 → 가리개에 얹는다
function maskStroke(m,s,t){const p=pAt(s,t);if(p<=0)return null;const c=tmp.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);
 const e=core(c,s,p,'#fff');c.lineCap='round';c.lineJoin='round';
 c.globalCompositeOperation='destination-out';c.strokeStyle='#000';for(const b of s.gb)hair(c,s,b,p,true);for(const b of s.rg)if(b.cut)hair(c,s,b,p,true);
 c.globalCompositeOperation='source-over';c.strokeStyle='#fff';for(const b of s.tb)hair(c,s,b,p,false);for(const b of s.eb)hair(c,s,b,p,false);for(const b of s.rg)if(!b.cut)hair(c,s,b,p,true);
 c.fillStyle='#fff';spatter(c,s,p);m.drawImage(tmp,0,0);return e}
// 무지개 띠: 붓털마다 색이 다른 붓 (위가 빨강 → 아래가 보라), 아래에 옅은 빛. 꼬리는 색 털이 갈라진다
function rainbow(X,s,t,alpha,m){const p=pAt(s,t);if(p<=0||alpha<=0)return;
 // 바깥 옅은 빛은 바로, 색 붓털 · 마른 결은 따로 그려 결을 지운 뒤 얹는다 (물감이 덜 묻은 줄이 비친다)
 X.save();setM(X,m);X.globalAlpha=alpha*.45;X.shadowColor='rgba(255,236,252,.9)';X.shadowBlur=22;core(X,s,p,'rgba(255,250,255,.3)');X.restore();
 const c=tmp.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);setM(c,m);c.lineCap='round';c.lineJoin='round';
 const r=rnd(s.seed);for(let i=0;i<s.rb;i++){const o=-1+2*(i+.5)/s.rb+(r()-.5)*.04,h=(o*.5+.5)*280;c.strokeStyle=`hsl(${352-h},86%,${71+7*Math.abs(o)}%)`;
  const d1=s.coreEnd+(s.P.len-s.coreEnd)*(.25+.75*r());hair(c,s,{o:o*.92,d0:s.capIn*.3*r(),d1,lw:s.w/(s.rb*.42)*(.8+.4*r()),a:.66+.3*r()},p,false)}
 c.globalCompositeOperation='destination-out';c.strokeStyle='#000';for(const b of s.gb)hair(c,s,b,p,true);c.globalCompositeOperation='source-over';
 c.strokeStyle='rgba(255,255,255,.9)';for(const b of s.eb)hair(c,s,b,p,false,.7);
 c.setTransform(1,0,0,1,0,0);X.save();X.setTransform(1,0,0,1,0,0);X.globalAlpha=alpha;X.drawImage(tmp,0,0);X.restore()}
// 먹 번짐 (자막 뒤): 흐린 그림자 심 + 옅은 심 + 마른 꼬리 털
function ink(c,s,t,alpha){const p=pAt(s,t);if(p<=0||alpha<=0)return;c.save();
 c.shadowColor=`rgba(12,8,28,${.6*alpha})`;c.shadowBlur=24;c.shadowOffsetX=W*3;c.translate(-W*3,0);core(c,s,p,'#000');c.restore();c.save();c.lineCap='round';
 core(c,s,p,`rgba(18,12,38,${.16*alpha})`);c.strokeStyle='rgba(16,10,34,1)';for(const b of s.tb)hair(c,s,b,p,false,alpha*.26);c.restore()}
function gold(c,s,t,alpha){const p=pAt(s,t);if(p<=0||alpha<=0)return;c.save();c.lineCap='round';c.shadowColor='rgba(255,214,140,.8)';c.shadowBlur=8;
 core(c,s,p,`rgba(236,190,92,${.9*alpha})`);c.shadowBlur=0;c.strokeStyle='rgb(255,246,214)';for(const b of s.tb)hair(c,s,b,p,false,alpha*.85);c.restore()}
// 물감이 고인 가장자리: 색 붓 자국 둘레가 살짝 짙다 (번진 선)
function edges(c,e,a){if(!e||a<=0)return;c.save();c.lineJoin='round';c.filter='blur(1.4px)';c.globalCompositeOperation='multiply';
