<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 개별 검수</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171a28;color:#f5f1ff;font:16px system-ui}header,main{padding:24px;max-width:1440px;margin:auto}h1{margin:0 0 12px}button,select,input,textarea{font:inherit;padding:12px;border-radius:8px;border:1px solid #73748d}button,select{background:#30364c;color:white;min-height:44px}nav{display:flex;gap:8px;flex-wrap:wrap}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}.card{text-align:left}.poster{aspect-ratio:16/9;position:relative;overflow:hidden;background:linear-gradient(130deg,#333856,#819392);border-radius:12px}.poster img{position:absolute;width:100%;height:100%;object-fit:contain}.poster .actor{width:55%;left:40%;object-fit:contain}.poster.detail .actor{height:165%;top:0;object-position:top}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.gallery{display:flex;gap:16px;flex-wrap:wrap}.tile{width:200px}.tile img{width:100%;height:180px;object-fit:contain;background:#d5d3de;border-radius:8px}.missing{padding:32px;background:#30364c;border-radius:8px}textarea{display:block;width:100%;min-height:100px;margin:12px 0}label{display:block;margin:16px 0}input[type=checkbox]{width:24px;height:24px;vertical-align:middle}p{overflow-wrap:anywhere}small{color:#c4c9df}@media(max-width:600px){header,main{padding:16px}.pair{grid-template-columns:1fr}.tile{width:calc(50% - 8px)}}
</style><header><h1>캐릭터 개별 검수</h1><p>원본과 새 디자인을 비교하고 캐릭터별 승인·의견을 저장합니다.</p><nav><select id="tier" aria-label="등급"><option value="">모든 등급</option></select><select id="element" aria-label="속성"><option value="">모든 속성</option></select><select id="story" aria-label="메인 스토리"><option value="">전체 스토리</option><option value="true">메인 스토리</option><option value="false">기타</option></select><select id="status" aria-label="제작 상태"><option value="">전체 상태</option><option>done</option><option>partial</option></select><button id="export">검수 내보내기</button></nav></header>
<main><section id="cards"></section><section id="view"><p>캐릭터를 선택하세요. 파일이 없는 항목은 제작 중으로 표시됩니다.</p></section></main><script src="cast-data.js"></script><script>
const cropStyle=document.createElement('style');cropStyle.textContent='.poster.detail .actor{height:100%;object-fit:cover;object-position:top}.tile{margin:0}';document.head.append(cropStyle);
const data=window.CAST||[], $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let reviews={};try{reviews=JSON.parse(localStorage.getItem('cast-v4-reviews')||'{}')}catch{}
const archetype=document.createElement('select');archetype.id='archetype';archetype.setAttribute('aria-label','매력 유형');archetype.add(new Option('모든 매력 유형',''));document.querySelector('nav').insertBefore(archetype,$('export'));
for(const key of ['tier','element','archetype'])for(const value of [...new Set(data.map(c=>c[key]).filter(Boolean))])$(key).add(new Option(value,value));
function image(c,file,cls=''){return c.files.includes(file)?`<img class="${cls}" src="${escape(c.id)}/web/${file.replace('.png','.webp')}" onerror="this.onerror=null;this.src='${escape(c.id)}/${file}'" alt="${escape(c.name)} ${file}">`:'<div class="missing">제작 중</div>'}
function bg(c,part){const name=escape(c.element)+'_'+part;if(!(window.BACKGROUNDS||[]).includes(name+'.png'))return '';return `<img src="_bg/web/${name}.webp" alt="" onerror="this.onerror=()=>this.remove();this.src='_bg/${name}.png'">`}
function poster(c,detail=false){return `<div class="poster ${detail?'detail':''}">${bg(c,'far')}${!detail?image(c,'fx_back.png'):''}${image(c,detail?'detail.png':'pickup.png','actor')}${bg(c,'near')}${!detail?image(c,'fx_front.png'):''}</div>`}
function show(c){const r=reviews[c.id]||{};$('view').innerHTML=`<h2>${escape(c.name)} · ${escape(c.tier)} / ${escape(c.element)}</h2><div class="pair"><section><h3>픽업 · 전신</h3>${poster(c)}</section><section><h3>상세 · 무릎 위</h3>${poster(c,true)}</section></div><div class="gallery">${['cutin.png','cutin_cut.png','sd_idle.png','sd_attack.png','face.png'].map(f=>`<figure class="tile">${image(c,f)}<figcaption>${f}</figcaption></figure>`).join('')}</div>${['expression','pose','legwear','leg_appeal','notes'].map(k=>`<p><strong>${k}</strong> · ${escape(c[k])}</p>`).join('')}<h3>게임 원본</h3><div class="gallery">${['game_idle.png','game_attack.png','game_cutin.png'].map(f=>`<div class="tile">${image(c,f)}</div>`).join('')}</div><label><input id="approved" type="checkbox" ${r.approved?'checked':''}> 검수 완료</label><label for="comment">PD 의견</label><textarea id="comment">${escape(r.comment||'')}</textarea><small>현재 브라우저에 자동 저장됩니다.</small>`;for(const id of ['approved','comment'])$(id).oninput=()=>{reviews[c.id]={approved:$('approved').checked,comment:$('comment').value};localStorage.setItem('cast-v4-reviews',JSON.stringify(reviews))}}
function render(){$('cards').replaceChildren();for(const c of data.filter(c=>(!$('tier').value||c.tier===$('tier').value)&&(!$('element').value||c.element===$('element').value)&&(!$('archetype').value||c.archetype===$('archetype').value)&&(!$('status').value||c.status===$('status').value)&&(!$('story').value||String(c.main_story)===$('story').value))){let b=document.createElement('button');b.className='card';b.textContent=`${c.name} · ${c.tier} · ${c.archetype||'기존 승인'} · ${c.status}`;b.onclick=()=>show(c);$('cards').append(b)}}for(const id of ['tier','element','story','status','archetype'])$(id).onchange=render;
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(reviews,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='cast-v4-reviews.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();if(data.length)show(data[0]);
</script></html>
