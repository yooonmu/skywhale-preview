<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>레인보우 아틀리에 · 비율 시안</title>
<style>
:root{font-family:system-ui,sans-serif;color:#32294a;background:#f5f1fa}*{box-sizing:border-box}body{margin:0}header,main{max-width:1500px;margin:auto;padding:28px}header{padding-bottom:4px}h1{font-size:clamp(26px,4vw,42px);margin:8px 0}header p{color:#615572;line-height:1.6}.eyebrow{color:#805c9f;font-weight:800;letter-spacing:.12em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}.card{background:#fff;border:1px solid #e0d6eb;border-radius:18px;overflow:hidden;box-shadow:0 8px 25px #68528512}.card h2{font-size:20px;margin:14px 16px 2px}.meta{margin:0 16px 12px;color:#655973;font-size:14px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#e8dfef}.pair button{border:0;padding:0;background:#faf5eb;cursor:zoom-in;color:#4a3d59;font:inherit}.pair img{display:block;width:100%;height:270px;object-fit:contain}.pair span{display:block;background:#f2eafa;padding:8px;font-size:13px;font-weight:700}.pair button:focus-visible,.close:focus-visible{outline:3px solid #754b9d;outline-offset:-3px}dialog{border:0;border-radius:16px;padding:14px;max-width:min(95vw,900px);max-height:95vh;background:#fff;color:#32294a}dialog::backdrop{background:#21172bcf}dialog img{display:block;max-width:100%;max-height:78vh;margin:auto}.close{display:block;margin:8px 0 0 auto;min-width:64px;min-height:44px;border:0;border-radius:8px;background:#665078;color:white;cursor:pointer}
</style></head><body><header><div class="eyebrow">RAINBOW ATELIER · ART STUDY</div><h1>아이들 비율 비교 시안</h1><p>기존 SD와 일반 비율을 나란히 비교합니다. 이미지를 누르면 확대됩니다.<br>새 이미지는 OpenAI Images · gpt-image-2로 생성한 AI 샘플이며 게임 적용본이 아닙니다. 일부 세부 표현은 검토가 필요합니다.</p></header>
<main><div class="grid" id="grid"></div></main><dialog id="viewer" aria-label="이미지 확대"><img id="large" alt=""><button class="close" type="button">닫기</button></dialog>
<script>
const rows=`arca 아르카 rainbow 신화
yunseul 윤슬 rainbow 신화
nox 녹스 rainbow 신화
serena 세레나 purple SS
yuna 유나 purple A
lumi 루미 purple S
noel 노엘 purple S
dahee 다희 purple A
sora 소라 purple A
bina 비나 purple B
hana 하나 purple B
ria 리아 purple B
yeseul 예슬 purple B
aria 아리아 white SS
mio 미오 white B
hayun 하윤 white S
jiwoo 지우 white S
seoa 서아 white A
chaewon 채원 white A
eunbi 은비 white A
dain 다인 white B
yerin 예린 white B
nari 나리 white B
flora 플로라 green SS
ciel 시엘 green A
rina 리나 green S
haneul 하늘 green S
mint 민트 green A
doa 도아 green A
yuri 유리 green B
boram 보람 green B
saebom 새봄 green B
nayeon 나연 green B
ignis 이그니 red SS
karen 카렌 red S
hongi 홍이 red S
suah 수아 red A
jia 지아 red A
garam 가람 red A
dana 다나 red B
youngeun 영은 red B
rara 라라 red B
seol 설 red B
marin 마린 blue SS
harin 하린 blue A
yeonwoo 연우 blue S
siwoo 시우 blue S
gaeul 가을 blue A
dohee 도희 blue A
seoyun 서윤 blue B
ahyoung 아영 blue B
ujin 유진 blue B
haeun 해은 blue B
sol 솔 orange SS
noa 노아 orange A
yeoreum 여름 orange S
juhee 주희 orange S
miso 미소 orange A
chaeyoung 채영 orange A
sena 세나 orange B
dabin 다빈 orange B
ina 이나 orange B
gyeol 결 orange B`.split('\n').map(x=>x.split(' '));
const elements={rainbow:'무지개',purple:'보라',white:'빛',green:'생명',red:'불',blue:'물',orange:'노을'};
const grid=document.querySelector('#grid'),viewer=document.querySelector('#viewer'),large=document.querySelector('#large');
for(const [id,name,el,tier] of rows){const card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${name}</h2><p class="meta">${elements[el]} · ${tier}</p><div class="pair"><button type="button" aria-label="${name} 기존 이미지 확대"><img loading="lazy" src="${id}_current.jpg" alt="${name} 기존 SD"><span>기존 SD</span></button><button type="button" aria-label="${name} 시안 이미지 확대"><img loading="lazy" src="${id}.jpg" alt="${name} 일반 비율 시안"><span>일반 비율 · AI 시안</span></button></div>`;grid.append(card)}
grid.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;const image=button.querySelector('img');large.src=image.src;large.alt=image.alt;viewer.showModal()});
document.querySelector('.close').addEventListener('click',()=>viewer.close());
</script></body></html>
